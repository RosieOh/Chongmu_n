name: chongmu_n
description: "똑똑한 총무 - 차수별 N빵 정산기"
publish_to: "none"

# 스토어에 새 버전을 올릴 때마다 + 뒤 숫자(빌드 번호)를 1씩 올려주세요.
version: 1.1.0+2

environment:
  sdk: ^3.5.0

# ─────────────────────────────────────────────
# M1 8GB 최적화: 꼭 필요한 패키지만 사용합니다.
# ─────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1 # 머티리얼 UI 위젯 (Flutter 3.47+ 에서 프레임워크 밖으로 분리됨)
  shared_preferences: ^2.3.0 # 기기 로컬 저장 (계좌, 정산 데이터, PRO 여부)
  intl: ^0.20.0 # 천 단위 콤마, 날짜 포맷
  share_plus: ^11.0.0 # 영수증 이미지 공유/저장 (iOS 공유 시트 → '이미지 저장')
  url_launcher: ^6.3.3 # 토스·카카오페이 송금 링크 열기

  # ▼ 2단계(광고 연동) 때 주석 해제 — Info.plist 설정이 필요해서 지금은 꺼둡니다.
  # google_mobile_ads: ^6.0.0
  # ▼ 3단계(인앱결제) 때 주석 해제
  # purchases_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ─────────────────────────────────────────────
# 앱 아이콘 자동 생성 설정
# assets/images/app_icon.png (1024x1024, 투명 배경 X) 넣은 뒤
#   dart run flutter_launcher_icons
# ─────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
